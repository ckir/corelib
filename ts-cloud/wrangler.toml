name = "ts-cloud"
main = "src/platform/cloudflare/worker.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Server-only deps reachable only behind runtime-gated dynamic import()s in
# @ckirg/corelib (pino logger stack + DB drivers). They never execute on the edge,
# but wrangler's bundler statically resolves the import() specifiers, so we alias
# them to an edge stub that throws if actually invoked. Keeps the worker bundling +
# booting without dragging the Node-only server stack onto workerd.
[alias]
"pino" = "./src/platform/cloudflare/server-dep-stub.mjs"
"pino-pretty" = "./src/platform/cloudflare/server-dep-stub.mjs"
"pino-lambda" = "./src/platform/cloudflare/server-dep-stub.mjs"
"pino-socket" = "./src/platform/cloudflare/server-dep-stub.mjs"
"@google-cloud/pino-logging-gcp-config" = "./src/platform/cloudflare/server-dep-stub.mjs"
"postgres" = "./src/platform/cloudflare/server-dep-stub.mjs"
"@libsql/client" = "./src/platform/cloudflare/server-dep-stub.mjs"

[dev]
port = 3000

[vars]
PLATFORM = "cloudflare"
# CORELIB_TURSO_URL = ""
# CORELIB_TURSO_TOKEN = ""
