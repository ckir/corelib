# =============================================
# FILE: .github/workflows/pipeline.yml
# PURPOSE: Corelib Monorepo CI/CD Pipeline
# Strictly staged: Validate → Test → Deploy Docs → Release
# =============================================

name: Corelib Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  # Force pnpm to use the same version everywhere
  PNPM_VERSION: "11.5.2"
  # Skip Rust FFI download during CI builds (we build it ourselves)
  MODE: "production"
  # Ensure cargo uses the workspace cache
  CARGO_INCREMENTAL: "0"

# =============================================
# CONCURRENCY CONTROL
# =============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================
# JOBS
# =============================================

jobs:
  # ---------------------------------------------------------
  # 1. VALIDATE — Linting & Formatting (Biome)
  # Fast, runs on every PR/push. No heavy deps.
  # ---------------------------------------------------------
  validate:
    name: Validate (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean Cargo target directory
        run: cargo clean --manifest-path rust/Cargo.toml

      - name: Run Biome check (lint + format)
        run: pnpm lint-all

      # lint-all runs biome with --write --unsafe, which silently deletes console.* calls (an
      # "unsafe" fix) instead of reporting them. This read-only pass is what enforces
      # noConsole / noExplicitAny in CI.
      - name: Strict lint (read-only)
        run: pnpm lint:strict

      # No build needed: tsconfig.base.json paths resolve workspace imports to source.
      - name: Typecheck
        run: pnpm typecheck-all

  # ---------------------------------------------------------
  # 2. TEST — Multi-OS Matrix (Ubuntu, macOS, Windows)
  # TS packages MUST be built before testing for correct workspace resolution.
  # ---------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (required for workspace resolution)
        run: pnpm build-all

      # Build Rust FFI for Linux (required for ts-core tests that use FFI)
      - name: Build Rust FFI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -t corelib-builder -f rust/Dockerfile.linux .
          docker rm -f corelib-temp 2>/dev/null || true
          docker create --name corelib-temp corelib-builder
          docker cp corelib-temp:/app/rust/corelib-rust.node ts-core/corelib-rust.node
          docker rm -f corelib-temp

      - name: Run all tests
        run: pnpm test-all:run
        env:
          # Ensure test environment matches production
          MODE: "test"
          NODE_ENV: "test"

      # Rust FFI tests (only on Linux where cargo builds natively)
      - name: Run Rust tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --manifest-path rust/Cargo.toml -- --test-threads=1
        env:
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"

  # ---------------------------------------------------------
  # 3. DEPLOY DOCS — TypeDoc to GitHub Pages
  # Triggered only on main branch push (not PRs).
  # ---------------------------------------------------------
  deploy-docs:
    name: Deploy Docs
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (required for TypeDoc)
        run: pnpm build-all

      - name: Generate documentation
        run: pnpm docs-all

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------
  # 4. RELEASE — Build & Upload 11 Assets
  # Triggered on version tags (v*). Produces:
  #   - 3 TS packages (.tgz)
  #   - 4 Rust FFI binaries (.node) — Darwin x64/arm64, Linux x64, Win x64
  #   - 2 CLI binaries (yahoo_streamer, alpaca_streamer) × 4 targets
  # ---------------------------------------------------------
  release:
    name: Release (${{ matrix.target }})
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # TS package builds (run on any OS, but Ubuntu is fastest)
          - os: ubuntu-latest
            target: ts-packages
            name: "Build TS Packages"
          # Rust FFI binaries
          - os: ubuntu-latest
            target: rust-linux-x64
            name: "Build Rust FFI (Linux x64)"
          - os: macos-latest
            target: rust-darwin-x64
            name: "Build Rust FFI (macOS x64)"
          - os: macos-latest
            target: rust-darwin-arm64
            name: "Build Rust FFI (macOS arm64)"
          - os: windows-latest
            target: rust-win32-x64
            name: "Build Rust FFI (Windows x64)"
          # CLI binaries (Rust)
          - os: ubuntu-latest
            target: cli-linux-x64
            name: "Build CLI Binaries (Linux x64)"
          - os: macos-latest
            target: cli-darwin-x64
            name: "Build CLI Binaries (macOS x64)"
          - os: macos-latest
            target: cli-darwin-arm64
            name: "Build CLI Binaries (macOS arm64)"
          - os: windows-latest
            target: cli-win32-x64
            name: "Build CLI Binaries (Windows x64)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- TS PACKAGE BUILD ---
      - name: Build TS packages
        if: matrix.target == 'ts-packages'
        run: |
          pnpm build-all
          pnpm pack --filter @ckirg/corelib --filter @ckirg/corelib-markets --filter @ckirg/corelib-cloud --prod
        shell: bash

      - name: Upload TS package artifacts
        if: matrix.target == 'ts-packages'
        uses: actions/upload-artifact@v4
        with:
          name: ts-packages
          path: |
            ts-core/*.tgz
            ts-markets/*.tgz
            ts-cloud/*.tgz
          retention-days: 30

      # --- RUST FFI BUILDS ---
      - name: Setup Rust
        if: matrix.target != 'ts-packages'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'rust-darwin-arm64' && 'aarch64-apple-darwin' || '' }}

      - name: Cache cargo
        if: matrix.target != 'ts-packages'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust FFI (cdylib)
        if: matrix.target != 'ts-packages' && matrix.target != 'cli-*'
        working-directory: ./rust
        run: |
          cargo build --release --features napi
          # Copy .node binary with standard release naming
          TARGET_SUFFIX="${{ matrix.target }}"
          TARGET_SUFFIX="${TARGET_SUFFIX/rust-/}"
          cp target/release/corelib-rust.node ../corelib-rust-${TARGET_SUFFIX}.node

      - name: Build CLI binaries (yahoo_streamer, alpaca_streamer)
        if: matrix.target != 'ts-packages' && startsWith(matrix.target, 'cli-')
        working-directory: ./rust
        run: |
          cargo build --release --features clap --bin yahoo_streamer --bin alpaca_streamer
          mkdir -p ../cli-bin
          TARGET_SUFFIX="${{ matrix.target }}"
          TARGET_SUFFIX="${TARGET_SUFFIX/cli-/}"
          cp target/release/yahoo_streamer ../cli-bin/yahoo_streamer-${TARGET_SUFFIX}
          cp target/release/alpaca_streamer ../cli-bin/alpaca_streamer-${TARGET_SUFFIX}

      - name: Upload Rust FFI artifact
        if: matrix.target != 'ts-packages' && matrix.target != 'cli-*'
        uses: actions/upload-artifact@v4
        with:
          name: rust-ffi-${{ matrix.target }}
          path: corelib-rust-*.node
          retention-days: 30

      - name: Upload CLI binary artifacts
        if: startsWith(matrix.target, 'cli-')
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries-${{ matrix.target }}
          path: cli-bin/*
          retention-days: 30

  # ---------------------------------------------------------
  # 5. RELEASE AGGREGATE — Collect all artifacts & create GitHub Release
  # Runs after all matrix jobs complete.
  # ---------------------------------------------------------
  release-aggregate:
    name: Aggregate & Publish Release
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          pattern: ts-packages,rust-ffi-*,cli-binaries-*

      - name: List downloaded artifacts
        run: |
          echo "=== Release Artifacts ==="
          find release-artifacts -type f -name "*.node" -o -name "*.tgz" -o -name "yahoo_streamer*" -o -name "alpaca_streamer*" | sort

      - name: Verify all 11 expected assets exist
        id: verify
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Verifying assets for version $VERSION"
          
          # Expected assets:
          # 1. @ckirg/corelib-${VERSION}.tgz
          # 2. @ckirg/corelib-markets-${VERSION}.tgz
          # 3. @ckirg/corelib-cloud-${VERSION}.tgz
          # 4. corelib-rust-linux-x64.node
          # 5. corelib-rust-darwin-x64.node
          # 6. corelib-rust-darwin-arm64.node
          # 7. corelib-rust-win32-x64.node
          # 8. yahoo_streamer-linux-x64
          # 9. yahoo_streamer-darwin-x64
          # 10. yahoo_streamer-darwin-arm64
          # 11. yahoo_streamer-win32-x64
          # 12. alpaca_streamer-linux-x64
          # 13. alpaca_streamer-darwin-x64
          # 14. alpaca_streamer-darwin-arm64
          # 15. alpaca_streamer-win32-x64
          
          MISSING=0
          
          # Check TS packages
          for pkg in corelib corelib-markets corelib-cloud; do
            if [ ! -f "release-artifacts/ts-packages/@ckirg/${pkg}-${VERSION}.tgz" ]; then
              echo "❌ MISSING: @ckirg/${pkg}-${VERSION}.tgz"
              MISSING=1
            else
              echo "✅ Found: @ckirg/${pkg}-${VERSION}.tgz"
            fi
          done
          
          # Check Rust FFI
          for target in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            if [ ! -f "release-artifacts/rust-ffi-rust-${target}/corelib-rust-${target}.node" ]; then
              echo "❌ MISSING: corelib-rust-${target}.node"
              MISSING=1
            else
              echo "✅ Found: corelib-rust-${target}.node"
            fi
          done
          
          # Check CLI binaries
          for cli in yahoo_streamer alpaca_streamer; do
            for target in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
              ext=""
              [[ "$target" == "win32-x64" ]] && ext=".exe"
              if [ ! -f "release-artifacts/cli-binaries-cli-${target}/${cli}-${target}${ext}" ]; then
                echo "❌ MISSING: ${cli}-${target}${ext}"
                MISSING=1
              else
                echo "✅ Found: ${cli}-${target}${ext}"
              fi
            done
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "::error::One or more release assets are missing"
            exit 1
          fi
          echo "✅ All 11+ assets verified"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ts-packages/@ckirg/corelib-*.tgz
            release-artifacts/ts-packages/@ckirg/corelib-markets-*.tgz
            release-artifacts/ts-packages/@ckirg/corelib-cloud-*.tgz
            release-artifacts/rust-ffi-*/corelib-rust-*.node
            release-artifacts/cli-binaries-*/yahoo_streamer-*
            release-artifacts/cli-binaries-*/alpaca_streamer-*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}