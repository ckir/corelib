# =============================================
# FILE: .github/workflows/pipeline.yml
# PURPOSE: Corelib Monorepo CI/CD Pipeline
# Strictly staged: Validate → Test → Deploy Docs → Release
# =============================================

name: Corelib Pipeline

on:
  push:
    branches: [main]
    # The Release jobs run only for version tags (see their `if:` conditions); without this
    # filter a pushed tag never starts the pipeline.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly release rehearsal: builds every release artifact without publishing, so a broken
    # release path is found on a quiet Monday rather than on release day.
    - cron: '0 6 * * 1'
  release:
    types: [published]

env:
  # Force pnpm to use the same version everywhere
  PNPM_VERSION: "11.5.2"
  # Skip Rust FFI download during CI builds (we build it ourselves)
  MODE: "production"
  # Ensure cargo uses the workspace cache
  CARGO_INCREMENTAL: "0"

# =============================================
# CONCURRENCY CONTROL
# =============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================
# JOBS
# =============================================

jobs:
  # ---------------------------------------------------------
  # 1. VALIDATE — Linting & Formatting (Biome)
  # Fast, runs on every PR/push. No heavy deps.
  # ---------------------------------------------------------
  validate:
    name: Validate (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned in rust-toolchain.toml; installed explicitly so CI does not depend on rustup auto-install.
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Clean Cargo target directory
        run: cargo clean --manifest-path rust/Cargo.toml

      - name: Run Biome check (lint + format)
        run: pnpm lint-all

      # lint-all runs biome with --write --unsafe, which silently deletes console.* calls (an
      # "unsafe" fix) instead of reporting them. This read-only pass is what enforces
      # noConsole / noExplicitAny in CI.
      - name: Strict lint (read-only)
        run: pnpm lint:strict

      # No build needed: tsconfig.base.json paths resolve workspace imports to source.
      - name: Typecheck
        run: pnpm typecheck-all

      # Package layering (core <- markets <- cloud) and logger privacy; see .dependency-cruiser.cjs.
      - name: Dependency rules
        run: pnpm deps:check

  # ---------------------------------------------------------
  # 2. TEST — Multi-OS Matrix (Ubuntu, macOS, Windows)
  # TS packages MUST be built before testing for correct workspace resolution.
  # ---------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Build all packages (required for workspace resolution)
        run: pnpm build-all

      # rust/index.js and index.d.ts are generated by `napi build` but committed. The build rewrites
      # them whenever the napi CLI version or the Rust surface changes; fail if the committed copies
      # are stale (regenerate with `pnpm --filter corelib-rust build` and commit). Linux only: that is
      # the platform the committed files are generated on.
      - name: Verify generated napi bindings are committed
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- rust/index.js rust/index.d.ts

      # The browser entry ships to browsers/edge workers; it must not reach Node builtins.
      - name: Check browser bundle has no Node builtins
        run: pnpm check:browser-bundle

      # Build Rust FFI for Linux (required for ts-core tests that use FFI)
      - name: Build Rust FFI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -t corelib-builder -f rust/Dockerfile.linux .
          docker rm -f corelib-temp 2>/dev/null || true
          docker create --name corelib-temp corelib-builder
          docker cp corelib-temp:/app/rust/corelib-rust.node ts-core/corelib-rust.node
          docker rm -f corelib-temp

      - name: Run all tests
        run: pnpm test-all:run
        env:
          # Ensure test environment matches production
          MODE: "test"
          NODE_ENV: "test"

      # Enforces the per-package coverage floors in each vitest.config.ts (re-runs the unit tests).
      - name: Coverage thresholds (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test-all:coverage
        env:
          MODE: "test"
          NODE_ENV: "test"

      # Rust FFI tests (only on Linux where cargo builds natively)
      - name: Run Rust tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --manifest-path rust/Cargo.toml -- --test-threads=1
        env:
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"

  # ---------------------------------------------------------
  # 3. DEPLOY DOCS — TypeDoc to GitHub Pages
  # Triggered only on main branch push (not PRs).
  # ---------------------------------------------------------
  deploy-docs:
    name: Deploy Docs
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (required for TypeDoc)
        run: pnpm build-all

      - name: Generate documentation
        run: pnpm docs-all

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------
  # 4. RELEASE (publishes only on tags v*; everything before `release` is also a REHEARSAL)
  #    check-version -> build-ts + build-rust -> verify-assets -> release -> publish-npm
  # Rehearsal (no publishing) runs on pull requests that touch release-relevant paths, weekly,
  # and on manual dispatch, so the release path is exercised long before a tag is pushed.
  # Assets: 3 TS tarballs, 5 native modules (.node), 3 CLI binaries x 5 targets.
  # The Rust toolchain comes from rust-toolchain.toml via ./.github/actions/setup-rust.
  # ---------------------------------------------------------
  changes:
    name: Detect release-relevant changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          # Tags (the real release), the weekly schedule and manual dispatch always run the release
          # build. Plain pushes to main skip it (the full test matrix already ran); pull requests
          # run it only when they touch release-relevant paths.
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) echo "release=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            push)
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then echo "release=true"; else echo "release=false"; fi >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(rust/|ts-core/|ts-markets/|ts-cloud/|\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|rust-toolchain\.toml$)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  check-version:
    name: Check tag matches manifests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare tag with every manifest version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          bad=0
          check() { # label actual
            if [[ "$2" != "$TAG" ]]; then echo "::error::$1 is $2 but the tag is $TAG"; bad=1; else echo "ok  $1 = $2"; fi
          }
          for f in package.json ts-core/package.json ts-markets/package.json ts-cloud/package.json; do
            check "$f" "$(node -p "require('./$f').version")"
          done
          check "rust/Cargo.toml" "$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          check "rust/Cargo.lock (corelib-rust)" "$(awk '/^name = "corelib-rust"$/{getline; gsub(/version = |"/,""); print; exit}' rust/Cargo.lock)"
          exit $bad

  build-ts:
    name: Pack TS Packages
    needs: [test, changes, check-version]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.release == 'true' && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build-all
      - name: Pack packages
        run: |
          mkdir dist-packages
          pnpm --filter @ckirg/corelib pack --pack-destination ./dist-packages
          pnpm --filter @ckirg/corelib-markets pack --pack-destination ./dist-packages
          pnpm --filter @ckirg/corelib-cloud pack --pack-destination ./dist-packages
          ls -l dist-packages
      - uses: actions/upload-artifact@v7
        with:
          name: ts-packages
          path: dist-packages/*.tgz
          retention-days: 1

  build-rust:
    name: Build Rust (${{ matrix.artifact_name }})
    needs: [test, changes, check-version]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.release == 'true' && github.event_name != 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: corelib-rust-linux-x64.node
            bin_yahoo: yahoo_streamer-linux-x64
            bin_polling: nasdaq_polling-linux-x64
            bin_alpaca: alpaca_streamer-linux-x64
          # Built in amazonlinux:2023 (glibc 2.34) instead of on the runner: a binary linked on the
          # runner's glibc 2.39 would not load on AWS Lambda/Graviton or older distros.
          - os: ubuntu-24.04-arm
            artifact_name: corelib-rust-linux-arm64.node
            bin_yahoo: yahoo_streamer-linux-arm64
            bin_polling: nasdaq_polling-linux-arm64
            bin_alpaca: alpaca_streamer-linux-arm64
            glibc_container: true
          # macos-latest is Apple Silicon; the x64 build needs an Intel runner or it would
          # silently ship an arm64 binary under an x64 name.
          - os: macos-15-intel
            artifact_name: corelib-rust-darwin-x64.node
            bin_yahoo: yahoo_streamer-darwin-x64
            bin_polling: nasdaq_polling-darwin-x64
            bin_alpaca: alpaca_streamer-darwin-x64
          - os: macos-latest
            artifact_name: corelib-rust-darwin-arm64.node
            bin_yahoo: yahoo_streamer-darwin-arm64
            bin_polling: nasdaq_polling-darwin-arm64
            bin_alpaca: alpaca_streamer-darwin-arm64
          - os: windows-latest
            artifact_name: corelib-rust-win32-x64.node
            bin_yahoo: yahoo_streamer-win32-x64.exe
            bin_polling: nasdaq_polling-win32-x64.exe
            bin_alpaca: alpaca_streamer-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Build native module and CLI binaries in amazonlinux:2023 (glibc 2.34)
        if: ${{ matrix.glibc_container }}
        run: |
          scripts/build-rust-al2023.sh dist-rust --bins
          mv dist-rust/corelib-rust.node ${{ matrix.artifact_name }}
          mv dist-rust/yahoo_streamer ${{ matrix.bin_yahoo }}
          mv dist-rust/nasdaq_polling ${{ matrix.bin_polling }}
          mv dist-rust/alpaca_streamer ${{ matrix.bin_alpaca }}
      - name: Setup Rust (pinned)
        if: ${{ !matrix.glibc_container }}
        uses: ./.github/actions/setup-rust
      - name: Install dependencies
        if: ${{ !matrix.glibc_container }}
        run: pnpm install --frozen-lockfile
      - name: Build Rust FFI
        if: ${{ !matrix.glibc_container }}
        run: |
          cd rust
          pnpm exec napi build --release
      - name: Build CLI binaries
        if: ${{ !matrix.glibc_container }}
        run: |
          cd rust
          cargo build --release --bins --features clap
      - name: Rename artifacts
        if: ${{ !matrix.glibc_container }}
        shell: bash
        run: |
          mv rust/corelib-rust.node ${{ matrix.artifact_name }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv rust/target/release/yahoo_streamer.exe ${{ matrix.bin_yahoo }}
            mv rust/target/release/nasdaq_polling.exe ${{ matrix.bin_polling }}
            mv rust/target/release/alpaca_streamer.exe ${{ matrix.bin_alpaca }}
          else
            mv rust/target/release/yahoo_streamer ${{ matrix.bin_yahoo }}
            mv rust/target/release/nasdaq_polling ${{ matrix.bin_polling }}
            mv rust/target/release/alpaca_streamer ${{ matrix.bin_alpaca }}
          fi
      # One artifact per matrix leg; later jobs merge them all (merge-multiple).
      - uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.bin_yahoo }}
            ${{ matrix.bin_polling }}
            ${{ matrix.bin_alpaca }}
          if-no-files-found: error
          retention-days: 1

  # Runs on rehearsals AND releases: proves the artifact set is complete and well-formed before
  # anything is published, using the same inputs the release job will use.
  verify-assets:
    name: Verify release assets
    needs: [build-ts, build-rust]
    if: ${{ !cancelled() && !failure() && needs.build-ts.result == 'success' && needs.build-rust.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the 23 expected assets and tarball versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          missing=0
          expect() { if [[ -s "artifacts/$1" ]]; then echo "ok  $1"; else echo "::error::missing or empty: $1"; missing=1; fi; }
          for pkg in corelib corelib-markets corelib-cloud; do expect "ckirg-$pkg-$VERSION.tgz"; done
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            expect "corelib-rust-$t.node"
            for b in yahoo_streamer nasdaq_polling alpaca_streamer; do
              ext=""; [[ "$t" == win32-x64 ]] && ext=".exe"
              expect "$b-$t$ext"
            done
          done
          for f in artifacts/ckirg-*.tgz; do
            v=$(tar -xOzf "$f" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            [[ "$v" == "$VERSION" ]] || { echo "::error::$f contains version $v, expected $VERSION"; missing=1; }
          done
          exit $missing

  release:
    name: Create GitHub Release
    needs: [verify-assets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: ls -l artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true

  # ---------------------------------------------------------
  # 5. NPM PUBLISH (only after a successful GitHub Release, and only after a human approves the
  #    `npm-publish` environment). Publishes the exact tarballs the release built, so npm == release
  #    assets. Runs AFTER `release` so the native binaries are on the GitHub Release before the npm
  #    package (whose postinstall downloads them) is consumable. Idempotent: versions already on
  #    npm are skipped, so a re-run after a partial failure finishes the job instead of erroring.
  #    Requires the repo secret NPM_TOKEN: an npm Automation (2FA-bypass) token.
  # ---------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: ts-packages
          path: artifacts
      - name: Publish packages in dependency order (skipping versions already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Leading ./ is REQUIRED: `npm publish artifacts/x.tgz` is read as a GitHub repo spec
          # (owner/repo); `./artifacts/x.tgz` is read as a local tarball.
          # Base package first (markets/cloud depend on it); [0-9] avoids matching -markets/-cloud.
          for f in ./artifacts/ckirg-corelib-[0-9]*.tgz ./artifacts/ckirg-corelib-markets-*.tgz ./artifacts/ckirg-corelib-cloud-*.tgz; do
            meta=$(tar -xOzf "$f" package/package.json | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(p.name+'@'+p.version)")
            if npm view "$meta" version >/dev/null 2>&1; then
              echo "skip $meta (already published)"
            else
              echo "publish $meta"
              npm publish "$f" --access public
            fi
          done
