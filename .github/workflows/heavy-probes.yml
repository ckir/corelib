name: Heavy Probes
on:
  workflow_dispatch:
    inputs:
      probe:  { description: "probe id (cargo test name or probe path)", required: true }
      commit: { description: "commit SHA to check out", required: true }
jobs:
  run-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ inputs.commit }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with: { version: 11.5.2 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: 'pnpm' }
      - run: pnpm install
      - name: Run probe (prints a machine-parseable RESULT line)
        run: |
          echo "PROBE_START ${{ inputs.probe }}"
          P="${{ inputs.probe }}"
          if [[ "$P" == js:* ]]; then
            pnpm build-all                                          # JS/soak probes import the BUILT @ckirg/corelib binding
            # loadFFI looks for the UNSUFFIXED corelib-rust.node, but `napi build --platform` emits a
            # platform-suffixed file, and ts-core postinstall SKIPS the release fetch on CI — so copy it.
            cp rust/corelib-rust.*.node ts-core/corelib-rust.node
            node ${P#js:} 2>&1 | tee probe.out || true             # UNQUOTED on purpose: word-split the .mjs path + its --rate/--duration flags. js: targets are .mjs entrypoints only.
          else
            cargo test --manifest-path probes/rust/Cargo.toml "$P" -- --nocapture 2>&1 | tee probe.out || true
          fi
          echo "RESULT probe=$P outcome=$(grep -q 'PROBE_CONFIRMED' probe.out && echo confirmed || echo not-reproduced)"
