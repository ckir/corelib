# Installs the Rust toolchain pinned in rust-toolchain.toml (the single source of truth for the version).
# GitHub-hosted runners already ship rustup; minimal images (act, some self-hosted runners) do not, so
# bootstrap it first. `rustup toolchain install` with no argument reads rust-toolchain.toml.
name: Setup pinned Rust
description: Install the Rust toolchain pinned in rust-toolchain.toml, bootstrapping rustup if absent.
runs:
  using: composite
  steps:
    - name: Install rustup if missing
      shell: bash
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
    - name: Install the pinned toolchain
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install
