# token-discipline local gate: format+lint and rust clippy locally.
# Full verification (build-all + test-all:run) runs on pre-push and in CI validate pre-flight.
pre-commit:
  parallel: false
  commands:
    format-lint:
      run: |
        pnpm format-all && pnpm lint-all
    # Hint only (cross-shell echo): a type/API boundary changed — CI's validate
    # pre-flight will typecheck it; run `pnpm typecheck-all` locally if you want certainty.
    api-escalation:
      glob:
        - "**/*types.ts"
        - "**/*.d.ts"
        - "**/src/index.ts"
      run: echo "[token-discipline] API/type boundary changed -> CI validate will typecheck; local typecheck optional"

pre-push:
  parallel: false
  commands:
    verify-full:
      run: pnpm verify:full
