minimumReleaseAge: 0

packages:
  - ts-core
  - ts-markets
  - ts-cloud
  - rust

catalog:
  "@biomejs/biome": "^2.5.15"
  "@types/node": "^25.9.2"
  "@types/deno": "^2.7.0"
  "@types/ws": "^8.18.2"
  "@types/bun": "^1.4.2"
  "tsx": "^4.23.15"
  "typescript": "^6.0.3"
  "vitest": "^4.1.11"
  "@vitest/coverage-v8": "^4.1.11"
  "tsup": "^8.5.1"

# Patched floors for transitive dependencies of @jsr/gadicc__yahoo-finance2 (its optional MCP server tree:
# express, ajv, ...). Each is held inside its current major line; remove an entry once
# yahoo-finance2 itself ships a patched dependency. Gated by `pnpm audit:prod` in CI.
overrides:
  "proxy-addr": "^2.0.8"
  "fast-uri": "^3.1.7"
  "ip-address": "^10.3.1"
  "@modelcontextprotocol/sdk": "^1.31.0"

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  nx: true
  protobufjs: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - msw
  - nx
  - protobufjs
  - sharp
  - workerd
