[package]
name = "corelib-rust"
version = "0.1.22"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.9.0", features = ["napi9", "tokio_rt"] }
napi-derive = "3.5.6"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
cron = "0.16.0"
thiserror = "2.0.18"
futures = "0.3.32"

# === YAHOO STREAMING ===
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tungstenite = "0.29.0"
redb = "4.1.0"
base64 = "0.22.1"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
prost = "0.14.3"

# === RETRIEVE / KY ===
reqwest = { version = "0.13.4", features = ["json"] }
bytes = "1.11.1"
http = "1.4.1"

# CLI binary only
clap = { version = "4.6.1", features = ["derive"], optional = true }

# === OBSERVABILITY (Epic 4 flight recorder) ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-queue = "0.3"

[features]
default = ["finnhub", "napi"]
finnhub = []
# Gates the `#[napi(object)]` / `#[napi]` derive on the streaming WIRE types only.
# Default-on: corelib-rust is the napi cdylib and always builds with it. The feature
# exists to MARK the FFI seam and to make the future corelib-streaming crate lift
# mechanical (that crate builds with `--no-default-features` -> napi-free wire structs).
napi = []

[dev-dependencies]
wiremock = "0.6.5"
tracing = "0.1"

[build-dependencies]
napi-build = "2.3.2"

[[bin]]
name = "alpaca_streamer"
required-features = ["clap"]

[[bin]]
name = "nasdaq_polling"
required-features = ["clap"]

[[bin]]
name = "yahoo_streamer"
required-features = ["clap"]
