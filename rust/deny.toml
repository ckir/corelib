# cargo-deny policy for the corelib-rust crate. Run: `cargo deny --manifest-path rust/Cargo.toml check`
# (CI: .github/workflows/audit.yml). Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; yanked crates too. Add an `ignore` entry (with the RUSTSEC id and a
# reason) only for an advisory that is confirmed unreachable and has no fixed release.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Anything else (GPL/LGPL/AGPL/unknown) must be reviewed and added here on purpose.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions (e.g. windows-sys, rand) come from the ecosystem; surface them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
